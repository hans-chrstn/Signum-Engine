name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, Tests, Static Analysis, and Docs
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Show toolchain versions
        run: |
          nix develop --command bash -c '
            g++ --version
            clang-format --version
            clang-tidy --version
            cmake --version
            ninja --version
            just --version
            jq --version
          '

      - name: Verify development environment
        run: nix develop --command just doctor

      - name: Check formatting
        run: nix develop --command ./scripts/format-check.sh

      - name: Build Editor
        run: nix develop --command just build-target editor signum_editor

      - name: Build Playground
        run: nix develop --command just build-target playground signum_playground

      - name: Build and run unit tests
        run: nix develop --command just test-unit debug

      - name: Build with warnings as errors
        run: nix develop --command just build warnings

      - name: Run warnings-as-errors unit tests
        run: nix develop --command just test-unit warnings

      - name: Run Clang-Tidy
        run: nix develop --command just tidy

      - name: Build and test experimental C++26
        run: nix develop --command just test-unit experimental

      - name: Run sanitized unit tests
        run: nix develop --command just test-unit asan

      - name: Generate Doxygen documentation
        run: nix develop --command just docs

  package:
    name: Nix Production Package
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Evaluate flake outputs
        run: nix flake show --no-write-lock-file

      - name: Build production package
        run: nix build .#default --no-link --print-build-logs

