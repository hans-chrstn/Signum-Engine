name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, Unit Tests, Static Analysis, and Docs
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Show toolchain versions
        run: |
          nix develop --command bash -c '
            g++ --version
            clang-format --version
            clang-tidy --version
            cmake --version
            ninja --version
            just --version
          '

      - name: Verify development environment
        run: nix develop --command just doctor

      - name: Check formatting
        run: nix develop --command ./scripts/format-check.sh

      - name: Clean Debug build
        run: |
          nix develop --command just clean
          nix develop --command just build debug

      - name: Run unit tests
        run: nix develop --command just test-unit debug

      - name: Run Clang-Tidy
        run: nix develop --command just tidy

      - name: Build experimental C++26 configuration
        run: nix develop --command just build experimental

      - name: Test experimental C++26 configuration
        run: nix develop --command ctest --preset experimental -L "^unit$"

      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: nix develop --command just build asan

      - name: Run sanitized unit tests
        run: nix develop --command ctest --preset asan -L "^unit$"

      - name: Generate Doxygen documentation
        run: nix develop --command just docs
