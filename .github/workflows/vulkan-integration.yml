name: Vulkan Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CXXFLAGS: -Werror

jobs:
  vulkan-integration:
    name: Vulkan Runtime Integration Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Prepare Wayland runtime directory
        run: |
          runtime_dir="${RUNNER_TEMP}/signum-wayland-runtime"
          install -d -m 0700 "${runtime_dir}"
          echo "XDG_RUNTIME_DIR=${runtime_dir}" >> "${GITHUB_ENV}"

      - name: Verify Vulkan software driver
        run: nix develop .#ci --command vulkaninfo --summary

      - name: Verify development environment
        run: nix develop .#ci --command just doctor

      - name: Build and run Vulkan integration tests
        run: nix develop .#ci --command just test-integration engine

