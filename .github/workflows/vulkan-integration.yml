name: Vulkan Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CXXFLAGS: -Werror

jobs:
  vulkan-integration:
    name: Vulkan Runtime Integration Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Install Vulkan software driver
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            mesa-vulkan-drivers

      - name: Verify development environment
        run: nix develop --command just doctor

      - name: Run Vulkan integration tests
        run: nix develop --command just test-integration debug
